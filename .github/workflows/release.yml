name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Триггер при push тега v1.0.0, v2.1.0 и т.д.

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller build_windows.spec
      
      - name: List dist folder
        run: |
          dir dist
        shell: cmd
      
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\* -DestinationPath AutoWord-${{ github.ref_name }}.zip
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWord-Windows
          path: AutoWord-${{ github.ref_name }}.zip

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoWord-Windows
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          body: |
            ## AutoWord ${{ github.ref_name }}
            
            ### Установка
            1. Скачайте `AutoWord-${{ github.ref_name }}.zip`
            2. Распакуйте в любую папку
            3. Запустите `DocumentGenerator.exe`
            
            ### Обновление
            Программа обновляется автоматически через меню «Справка → Проверить обновления».
          files: |
            AutoWord-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
